<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎 水果消消乐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🍎 水果消消乐</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">得分</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="stat">
                    <span class="label">步数</span>
                    <span id="moves" class="value">30</span>
                </div>
                <div class="stat">
                    <span class="label">目标</span>
                    <span id="target" class="value">1000</span>
                </div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="controls">
            <p>🖱️ 点击两个相邻水果交换位置</p>
            <p>🎯 连成3个或以上相同水果消除得分</p>
        </div>
        
        <div id="start-screen" class="overlay">
            <div class="overlay-content">
                <h2>🍓 水果消消乐</h2>
                <p>点击相邻水果交换位置</p>
                <p>连成3个或以上消除得分</p>
                <p>在30步内达到1000分！</p>
                <button id="start-btn" class="btn-primary">开始游戏</button>
            </div>
        </div>
        
        <div id="game-over-screen" class="overlay hidden">
            <div class="overlay-content">
                <h2 id="result-title">🎉 游戏结束</h2>
                <p>最终得分：<span id="final-score" class="highlight">0</span></p>
                <p id="result-message">...</p>
                <button id="restart-btn" class="btn-primary">再来一局</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
